[build]
builder = "NIXPACKS"

[deploy]
startCommand = "sh -c 'python -m uvicorn src.main:app --host 0.0.0.0 --port ${PORT:-8013} --workers ${UVICORN_WORKERS:-2}'"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[env]
PYTHONUNBUFFERED = "1"
PYTHONDONTWRITEBYTECODE = "1"
LOG_LEVEL = "INFO"
ENVIRONMENT = "production"
