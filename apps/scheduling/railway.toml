# apps/scheduling/railway.toml

[build]
builder = "NIXPACKS"

[deploy]
# Use Python script to handle PORT variable properly
startCommand = "python railway_start.py"
healthcheckPath = "/health"
healthcheckTimeout = 30
numReplicas = 1
sleepApplication = false
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
watchPaths = ["apps/scheduling/**"]

[env]
PYTHONUNBUFFERED = "1"
PYTHONDONTWRITEBYTECODE = "1"
PYTHONPATH = "."
LOG_LEVEL = "INFO"
SERVICE_NAME = "scheduling"
SERVICE_VERSION = "1.0.0"

# Database Configuration
DATABASE_URL = "${{ DATABASE_URL }}"
REDIS_URL = "${{ REDIS_URL }}"

# OpenAI API Configuration
OPENAI_API_KEY = "${{ OPENAI_API_KEY }}"
OPENAI_MODEL = "gpt-4"

# Calendar Integration
GOOGLE_CALENDAR_API_KEY = "${{ GOOGLE_CALENDAR_API_KEY }}"
GOOGLE_CLIENT_ID = "${{ GOOGLE_CLIENT_ID }}"
GOOGLE_CLIENT_SECRET = "${{ GOOGLE_CLIENT_SECRET }}"
ENABLE_GOOGLE_CALENDAR = "true"

# Outlook Integration
MICROSOFT_CLIENT_ID = "${{ MICROSOFT_CLIENT_ID }}"
MICROSOFT_CLIENT_SECRET = "${{ MICROSOFT_CLIENT_SECRET }}"
MICROSOFT_TENANT_ID = "${{ MICROSOFT_TENANT_ID }}"
ENABLE_OUTLOOK_CALENDAR = "true"

# Apple Calendar Integration
ENABLE_APPLE_CALENDAR = "false"
APPLE_CALENDAR_API_KEY = "${{ APPLE_CALENDAR_API_KEY }}"

# Zoom Integration
ZOOM_API_KEY = "${{ ZOOM_API_KEY }}"
ZOOM_API_SECRET = "${{ ZOOM_API_SECRET }}"
ZOOM_WEBHOOK_SECRET = "${{ ZOOM_WEBHOOK_SECRET }}"
ENABLE_ZOOM_INTEGRATION = "true"
AUTO_CREATE_ZOOM_MEETINGS = "true"

# Microsoft Teams Integration
TEAMS_APP_ID = "${{ TEAMS_APP_ID }}"
TEAMS_APP_SECRET = "${{ TEAMS_APP_SECRET }}"
ENABLE_TEAMS_INTEGRATION = "true"

# Google Meet Integration
ENABLE_GOOGLE_MEET = "true"
AUTO_CREATE_MEET_LINKS = "true"

# AI Scheduling Features
ENABLE_AI_SCHEDULING = "true"
ENABLE_SMART_SUGGESTIONS = "true"
ENABLE_CONFLICT_DETECTION = "true"
ENABLE_OPTIMAL_TIME_SELECTION = "true"
ENABLE_TRAVEL_TIME_CALCULATION = "true"

# Time Zone Management
DEFAULT_TIMEZONE = "UTC"
ENABLE_TIMEZONE_DETECTION = "true"
SUPPORT_MULTI_TIMEZONE = "true"
AUTO_TIMEZONE_CONVERSION = "true"

# Availability Management
DEFAULT_WORK_HOURS_START = "09:00"
DEFAULT_WORK_HOURS_END = "17:00"
DEFAULT_WORK_DAYS = "monday,tuesday,wednesday,thursday,friday"
BUFFER_TIME_MINUTES = "15"
MAX_MEETINGS_PER_DAY = "8"

# Booking Settings
ENABLE_INSTANT_BOOKING = "true"
REQUIRE_APPROVAL = "false"
MIN_BOOKING_NOTICE_HOURS = "2"
MAX_BOOKING_DAYS_AHEAD = "60"
ENABLE_WAITLIST = "true"

# Notification Settings
ENABLE_EMAIL_REMINDERS = "true"
ENABLE_SMS_REMINDERS = "true"
REMINDER_TIMES = "24h,1h,15m"
ENABLE_CALENDAR_INVITES = "true"

# Meeting Types
DEFAULT_MEETING_DURATION = "30"
AVAILABLE_DURATIONS = "15,30,45,60,90,120"
ENABLE_CUSTOM_DURATIONS = "true"
ENABLE_RECURRING_MEETINGS = "true"

# Security and Privacy
API_KEY = "${{ API_KEY }}"
WEBHOOK_SECRET = "${{ WEBHOOK_SECRET }}"
ENCRYPTION_KEY = "${{ ENCRYPTION_KEY }}"
ENABLE_GDPR_COMPLIANCE = "true"
DATA_RETENTION_DAYS = "730"

# Rate Limiting
RATE_LIMIT_PER_MINUTE = "100"
RATE_LIMIT_PER_HOUR = "1000"
RATE_LIMIT_PER_DAY = "10000"

# Caching
ENABLE_CACHING = "true"
CACHE_TTL = "300"
AVAILABILITY_CACHE_TTL = "60"

# Analytics
ENABLE_BOOKING_ANALYTICS = "true"
ENABLE_UTILIZATION_TRACKING = "true"
ENABLE_NO_SHOW_TRACKING = "true"
ANALYTICS_RETENTION_DAYS = "365"

# Integration Webhooks
WEBHOOK_ENDPOINTS = "${{ WEBHOOK_ENDPOINTS }}"
ENABLE_BOOKING_WEBHOOKS = "true"
ENABLE_CANCELLATION_WEBHOOKS = "true"
ENABLE_RESCHEDULE_WEBHOOKS = "true"

# Performance Settings
MAX_CONCURRENT_REQUESTS = "100"
CONNECTION_POOL_SIZE = "20"
QUERY_TIMEOUT = "30"

# Backup and Recovery
ENABLE_AUTO_BACKUP = "true"
BACKUP_INTERVAL_HOURS = "24"
BACKUP_RETENTION_DAYS = "30"

# Advanced Features
ENABLE_ROOM_BOOKING = "true"
ENABLE_RESOURCE_MANAGEMENT = "true"
ENABLE_CAPACITY_MANAGEMENT = "true"
ENABLE_CUSTOM_FIELDS = "true"
ENABLE_CONDITIONAL_LOGIC = "true"

# Localization
DEFAULT_LANGUAGE = "en"
SUPPORTED_LANGUAGES = "en,es,fr,de,it,pt,ja,ko,zh"
ENABLE_RTL_SUPPORT = "false"

# Monitoring
ENABLE_METRICS = "true"
METRICS_PORT = "9090"
ENABLE_HEALTH_CHECKS = "true"
HEALTH_CHECK_INTERVAL = "30"
