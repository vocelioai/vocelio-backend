# apps/knowledge-base/railway.toml

[build]
builder = "NIXPACKS"

[deploy]
# Use Python script to handle PORT variable properly
startCommand = "python railway_start.py"
healthcheckPath = "/health"
healthcheckTimeout = 30
numReplicas = 1
sleepApplication = false
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
watchPaths = ["apps/knowledge-base/**"]

[env]
PYTHONUNBUFFERED = "1"
PYTHONDONTWRITEBYTECODE = "1"
PYTHONPATH = "."
LOG_LEVEL = "INFO"
SERVICE_NAME = "knowledge-base"
SERVICE_VERSION = "1.0.0"

# OpenAI API Configuration
OPENAI_API_KEY = "${{ OPENAI_API_KEY }}"
OPENAI_MODEL = "gpt-4"

# Database Configuration
DATABASE_URL = "${{ DATABASE_URL }}"
REDIS_URL = "${{ REDIS_URL }}"

# Vector Database for Knowledge Management
VECTOR_DB_URL = "${{ VECTOR_DB_URL }}"
EMBEDDING_MODEL = "text-embedding-3-large"

# Knowledge Base Settings
MAX_KNOWLEDGE_ITEMS = "10000"
KNOWLEDGE_REFRESH_INTERVAL = "3600"
AUTO_CATEGORIZATION = "true"
SIMILARITY_THRESHOLD = "0.8"

# Security and Rate Limiting
API_KEY = "${{ API_KEY }}"
RATE_LIMIT_PER_MINUTE = "100"
ENABLE_CACHING = "true"
CACHE_TTL = "1800"

# Integration Settings
WEBHOOK_SECRET = "${{ WEBHOOK_SECRET }}"
ENABLE_WEBHOOKS = "true"
NOTIFICATION_ENDPOINT = "${{ NOTIFICATION_ENDPOINT }}"

# Monitoring and Logging
ENABLE_METRICS = "true"
METRICS_PORT = "9090"
LOG_FORMAT = "json"
ENABLE_DEBUG = "false"

# Knowledge Processing
ENABLE_AUTO_TAGGING = "true"
CONTENT_EXTRACTION = "true"
MULTI_LANGUAGE_SUPPORT = "true"
SUPPORTED_LANGUAGES = "en,es,fr,de,it,pt,ja,ko,zh"

# Search and Retrieval
SEARCH_ENGINE = "hybrid"
MAX_SEARCH_RESULTS = "50"
ENABLE_SEMANTIC_SEARCH = "true"
ENABLE_FULL_TEXT_SEARCH = "true"

# Content Management
ALLOWED_FILE_TYPES = "pdf,doc,docx,txt,md,html,json,csv"
MAX_FILE_SIZE_MB = "50"
AUTO_SUMMARIZATION = "true"
CONTENT_VERSIONING = "true"

# AI Features
ENABLE_CONTENT_GENERATION = "true"
ENABLE_KNOWLEDGE_SYNTHESIS = "true"
ENABLE_SMART_RECOMMENDATIONS = "true"
AI_CONFIDENCE_THRESHOLD = "0.7"
