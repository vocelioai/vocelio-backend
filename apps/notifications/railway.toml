# apps/notifications/railway.toml

[build]
builder = "NIXPACKS"

[deploy]
# Use Python script to handle PORT variable properly
startCommand = "python railway_start.py"
healthcheckPath = "/health"
healthcheckTimeout = 30
numReplicas = 1
sleepApplication = false
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
watchPaths = ["apps/notifications/**"]

[env]
PYTHONUNBUFFERED = "1"
PYTHONDONTWRITEBYTECODE = "1"
PYTHONPATH = "."
LOG_LEVEL = "INFO"
SERVICE_NAME = "notifications"
SERVICE_VERSION = "1.0.0"

# Database Configuration
DATABASE_URL = "${{ DATABASE_URL }}"
REDIS_URL = "${{ REDIS_URL }}"

# Email Configuration
SMTP_HOST = "${{ SMTP_HOST }}"
SMTP_PORT = "587"
SMTP_USERNAME = "${{ SMTP_USERNAME }}"
SMTP_PASSWORD = "${{ SMTP_PASSWORD }}"
SMTP_USE_TLS = "true"
EMAIL_FROM_ADDRESS = "${{ EMAIL_FROM_ADDRESS }}"
EMAIL_FROM_NAME = "Vocelio AI"

# SMS Configuration
SMS_PROVIDER = "twilio"
TWILIO_ACCOUNT_SID = "${{ TWILIO_ACCOUNT_SID }}"
TWILIO_AUTH_TOKEN = "${{ TWILIO_AUTH_TOKEN }}"
TWILIO_PHONE_NUMBER = "${{ TWILIO_PHONE_NUMBER }}"

# Push Notifications
FIREBASE_PROJECT_ID = "${{ FIREBASE_PROJECT_ID }}"
FIREBASE_PRIVATE_KEY = "${{ FIREBASE_PRIVATE_KEY }}"
FIREBASE_CLIENT_EMAIL = "${{ FIREBASE_CLIENT_EMAIL }}"
ENABLE_PUSH_NOTIFICATIONS = "true"

# Slack Integration
SLACK_BOT_TOKEN = "${{ SLACK_BOT_TOKEN }}"
SLACK_WEBHOOK_URL = "${{ SLACK_WEBHOOK_URL }}"
ENABLE_SLACK_NOTIFICATIONS = "true"

# Microsoft Teams Integration
TEAMS_WEBHOOK_URL = "${{ TEAMS_WEBHOOK_URL }}"
ENABLE_TEAMS_NOTIFICATIONS = "true"

# Discord Integration
DISCORD_WEBHOOK_URL = "${{ DISCORD_WEBHOOK_URL }}"
ENABLE_DISCORD_NOTIFICATIONS = "false"

# Webhook Configuration
WEBHOOK_SECRET = "${{ WEBHOOK_SECRET }}"
WEBHOOK_TIMEOUT = "30"
WEBHOOK_RETRY_ATTEMPTS = "3"
WEBHOOK_RETRY_DELAY = "5"

# Template Management
ENABLE_TEMPLATE_ENGINE = "true"
TEMPLATE_CACHE_TTL = "3600"
ENABLE_DYNAMIC_CONTENT = "true"
ENABLE_PERSONALIZATION = "true"

# AI Features
ENABLE_AI_OPTIMIZATION = "true"
ENABLE_SEND_TIME_OPTIMIZATION = "true"
ENABLE_CONTENT_OPTIMIZATION = "true"
ENABLE_SUBJECT_LINE_OPTIMIZATION = "true"
OPENAI_API_KEY = "${{ OPENAI_API_KEY }}"

# Delivery Settings
MAX_RETRIES = "3"
RETRY_BACKOFF_FACTOR = "2"
DELIVERY_TIMEOUT = "30"
BATCH_SIZE = "100"
RATE_LIMIT_PER_MINUTE = "1000"

# Analytics and Tracking
ENABLE_DELIVERY_TRACKING = "true"
ENABLE_OPEN_TRACKING = "true"
ENABLE_CLICK_TRACKING = "true"
ENABLE_BOUNCE_TRACKING = "true"
ANALYTICS_RETENTION_DAYS = "90"

# Security
API_KEY = "${{ API_KEY }}"
ENCRYPTION_KEY = "${{ ENCRYPTION_KEY }}"
ENABLE_SIGNATURE_VERIFICATION = "true"
ALLOWED_ORIGINS = "*"

# Queue Management
QUEUE_BACKEND = "redis"
QUEUE_DEFAULT_TIMEOUT = "300"
QUEUE_RESULT_TTL = "3600"
MAX_QUEUE_SIZE = "10000"

# Channel Priorities
EMAIL_PRIORITY = "1"
SMS_PRIORITY = "2"
PUSH_PRIORITY = "3"
SLACK_PRIORITY = "4"
TEAMS_PRIORITY = "5"

# Content Filtering
ENABLE_SPAM_FILTER = "true"
ENABLE_CONTENT_MODERATION = "true"
ENABLE_PROFANITY_FILTER = "true"
MAX_MESSAGE_LENGTH = "2000"

# Scheduling
ENABLE_SCHEDULED_NOTIFICATIONS = "true"
TIMEZONE_DEFAULT = "UTC"
ENABLE_TIMEZONE_DETECTION = "true"
MAX_SCHEDULE_DAYS = "365"

# Performance Monitoring
ENABLE_METRICS = "true"
METRICS_PORT = "9090"
ENABLE_HEALTH_CHECKS = "true"
HEALTH_CHECK_INTERVAL = "30"
