# apps/webhooks/railway.toml

[build]
builder = "NIXPACKS"

[deploy]
# Use Python script to handle PORT variable properly
startCommand = "python railway_start.py"
healthcheckPath = "/health"
healthcheckTimeout = 30
numReplicas = 1
sleepApplication = false
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
watchPaths = ["apps/webhooks/**"]

[env]
PYTHONUNBUFFERED = "1"
PYTHONDONTWRITEBYTECODE = "1"
PYTHONPATH = "."
LOG_LEVEL = "INFO"
SERVICE_NAME = "webhooks"
SERVICE_VERSION = "1.0.0"

# Database Configuration
DATABASE_URL = "${{ DATABASE_URL }}"
REDIS_URL = "${{ REDIS_URL }}"

# Security Configuration
WEBHOOK_SECRET = "${{ WEBHOOK_SECRET }}"
API_KEY = "${{ API_KEY }}"
ENCRYPTION_KEY = "${{ ENCRYPTION_KEY }}"
ENABLE_SIGNATURE_VERIFICATION = "true"
SIGNATURE_ALGORITHM = "sha256"

# Rate Limiting
RATE_LIMIT_PER_MINUTE = "1000"
RATE_LIMIT_PER_HOUR = "10000"
RATE_LIMIT_PER_DAY = "100000"
ENABLE_RATE_LIMITING = "true"
RATE_LIMIT_STORAGE = "redis"

# Delivery Configuration
MAX_RETRY_ATTEMPTS = "5"
RETRY_BACKOFF_FACTOR = "2"
INITIAL_RETRY_DELAY = "1"
MAX_RETRY_DELAY = "300"
DELIVERY_TIMEOUT = "30"
ENABLE_EXPONENTIAL_BACKOFF = "true"

# Queue Management
QUEUE_BACKEND = "redis"
QUEUE_DEFAULT_TIMEOUT = "300"
QUEUE_RESULT_TTL = "86400"
MAX_QUEUE_SIZE = "100000"
ENABLE_PRIORITY_QUEUES = "true"
HIGH_PRIORITY_QUEUE = "webhooks:high"
NORMAL_PRIORITY_QUEUE = "webhooks:normal"
LOW_PRIORITY_QUEUE = "webhooks:low"

# Batch Processing
ENABLE_BATCH_DELIVERY = "true"
BATCH_SIZE = "100"
BATCH_TIMEOUT = "5"
MAX_BATCH_WAIT_TIME = "30"
ENABLE_BATCH_COMPRESSION = "true"

# Monitoring and Logging
ENABLE_DELIVERY_TRACKING = "true"
ENABLE_RESPONSE_LOGGING = "true"
ENABLE_ERROR_LOGGING = "true"
LOG_RETENTION_DAYS = "30"
ENABLE_METRICS = "true"
METRICS_PORT = "9090"

# Event Types
SUPPORTED_EVENT_TYPES = "user.created,user.updated,user.deleted,call.started,call.ended,campaign.created,lead.created,meeting.scheduled,payment.completed"
ENABLE_EVENT_FILTERING = "true"
ENABLE_EVENT_TRANSFORMATION = "true"
ENABLE_CUSTOM_EVENTS = "true"

# Content Management
MAX_PAYLOAD_SIZE_MB = "10"
ENABLE_PAYLOAD_COMPRESSION = "true"
COMPRESSION_ALGORITHM = "gzip"
ENABLE_PAYLOAD_ENCRYPTION = "false"
CONTENT_TYPE = "application/json"

# Headers Configuration
DEFAULT_HEADERS = "Content-Type:application/json,User-Agent:Vocelio-Webhooks/1.0"
ENABLE_CUSTOM_HEADERS = "true"
MAX_CUSTOM_HEADERS = "20"
ENABLE_DYNAMIC_HEADERS = "true"

# SSL/TLS Configuration
VERIFY_SSL = "true"
SSL_CERT_PATH = "${{ SSL_CERT_PATH }}"
SSL_KEY_PATH = "${{ SSL_KEY_PATH }}"
ENABLE_CLIENT_CERTIFICATES = "false"
TLS_VERSION = "1.2"

# Filtering and Routing
ENABLE_URL_FILTERING = "true"
ENABLE_EVENT_ROUTING = "true"
ENABLE_CONDITIONAL_DELIVERY = "true"
ENABLE_WEBHOOK_TRANSFORMATION = "true"
TRANSFORMATION_ENGINE = "jq"

# Failure Handling
ENABLE_DEAD_LETTER_QUEUE = "true"
DLQ_MAX_SIZE = "10000"
DLQ_RETENTION_DAYS = "7"
ENABLE_FAILURE_NOTIFICATIONS = "true"
FAILURE_NOTIFICATION_EMAIL = "${{ FAILURE_NOTIFICATION_EMAIL }}"

# Performance Optimization
ENABLE_CONNECTION_POOLING = "true"
CONNECTION_POOL_SIZE = "100"
CONNECTION_TIMEOUT = "30"
READ_TIMEOUT = "30"
KEEP_ALIVE_TIMEOUT = "5"
MAX_CONNECTIONS_PER_HOST = "20"

# Analytics and Reporting
ENABLE_DELIVERY_ANALYTICS = "true"
ENABLE_PERFORMANCE_METRICS = "true"
ENABLE_SUCCESS_RATE_TRACKING = "true"
ANALYTICS_RETENTION_DAYS = "90"
ENABLE_REAL_TIME_DASHBOARD = "true"

# Webhook Management
ENABLE_WEBHOOK_REGISTRATION = "true"
ENABLE_WEBHOOK_VALIDATION = "true"
WEBHOOK_VALIDATION_TIMEOUT = "10"
ENABLE_WEBHOOK_HEALTH_CHECKS = "true"
HEALTH_CHECK_INTERVAL = "300"
HEALTH_CHECK_TIMEOUT = "10"

# Event Buffering
ENABLE_EVENT_BUFFERING = "true"
BUFFER_SIZE = "1000"
BUFFER_FLUSH_INTERVAL = "10"
MAX_BUFFER_AGE = "300"
ENABLE_OVERFLOW_PROTECTION = "true"

# Integration Features
ENABLE_SLACK_INTEGRATION = "true"
SLACK_WEBHOOK_URL = "${{ SLACK_WEBHOOK_URL }}"
ENABLE_TEAMS_INTEGRATION = "true"
TEAMS_WEBHOOK_URL = "${{ TEAMS_WEBHOOK_URL }}"
ENABLE_DISCORD_INTEGRATION = "false"
DISCORD_WEBHOOK_URL = "${{ DISCORD_WEBHOOK_URL }}"

# Advanced Features
ENABLE_WEBHOOK_CHAINING = "true"
ENABLE_CONDITIONAL_EXECUTION = "true"
ENABLE_WEBHOOK_ORCHESTRATION = "true"
ENABLE_EVENT_AGGREGATION = "true"
AGGREGATION_WINDOW = "60"

# Security Features
ENABLE_IP_WHITELISTING = "true"
ALLOWED_IPS = "${{ ALLOWED_IPS }}"
ENABLE_USER_AGENT_FILTERING = "true"
ALLOWED_USER_AGENTS = "${{ ALLOWED_USER_AGENTS }}"
ENABLE_REFERRER_VALIDATION = "false"

# Compliance and Auditing
ENABLE_AUDIT_LOGGING = "true"
AUDIT_LOG_RETENTION_DAYS = "365"
ENABLE_GDPR_COMPLIANCE = "true"
ENABLE_DATA_ANONYMIZATION = "false"
PII_FIELDS = "email,phone,address,ssn"

# Development and Testing
ENABLE_WEBHOOK_TESTING = "true"
TEST_WEBHOOK_URL = "${{ TEST_WEBHOOK_URL }}"
ENABLE_WEBHOOK_SIMULATION = "true"
ENABLE_PAYLOAD_VALIDATION = "true"
VALIDATION_SCHEMA_PATH = "/schemas"

# Multi-tenancy
ENABLE_MULTI_TENANCY = "true"
TENANT_ISOLATION = "database"
ENABLE_TENANT_RATE_LIMITING = "true"
ENABLE_TENANT_QUOTAS = "true"
DEFAULT_TENANT_QUOTA = "10000"
