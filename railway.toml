[build]
builder = "NIXPACKS"

[deploy]
# Use a shell so $PORT is expanded (previously passed literally to uvicorn)
# ${PORT:-8000} provides a sane fallback for local runs / non-platform starts.
startCommand = "sh -c 'python -m uvicorn --app-dir apps/api-gateway src.main:app --host 0.0.0.0 --port ${PORT:-8000} --workers ${UVICORN_WORKERS:-2}'"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[env]
PYTHONUNBUFFERED = "1"
PYTHONDONTWRITEBYTECODE = "1"
PYTHONPATH = "."
LOG_LEVEL = "INFO"
ENVIRONMENT = "production"

# Minimal set; sensitive vars should be added in Railway dashboard secrets, not committed.
