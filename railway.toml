[build]
builder = "NIXPACKS"

[deploy]
startCommand = "cd apps/api-gateway && python railway_start.py"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[env]
PYTHONUNBUFFERED = "1"
PYTHONDONTWRITEBYTECODE = "1"
LOG_LEVEL = "INFO"
PYTHONPATH = ".:apps/api-gateway:shared"
