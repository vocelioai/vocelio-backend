[build]
builder = "NIXPACKS"

[deploy]
# Use --app-dir so we can import src.main from inside apps/api-gateway (folder name has a hyphen so cannot be part of dotted path)
startCommand = "uvicorn --app-dir apps/api-gateway src.main:app --host 0.0.0.0 --port $PORT --workers 2"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[env]
PYTHONUNBUFFERED = "1"
PYTHONDONTWRITEBYTECODE = "1"
PYTHONPATH = "."
LOG_LEVEL = "INFO"
ENVIRONMENT = "production"

# Minimal set; sensitive vars should be added in Railway dashboard secrets, not committed.
